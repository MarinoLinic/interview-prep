<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="title desc"><title id="title">Practice and review</title><desc id="desc">Workflow diagram: Choose a topic then Work through a task then Check your answer.</desc><rect width="960" height="270" rx="12" fill="#f6f3ec"/><text x="30" y="44" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#222">Practice and review</text><rect x="30" y="78" width="280" height="150" rx="8" fill="#fff" stroke="#d5d1c8"/><rect x="30" y="78" width="280" height="6" rx="3" fill="#333a78"/><text x="48" y="122" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#222">Choose a topic</text><text x="48" y="161" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#424242">SQL, C#, .NET, Python</text><text x="48" y="188" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#424242">Interview and revision decks</text><path d="M318 153h13m-5-5 5 5-5 5" fill="none" stroke="#333a78" stroke-width="2"/><rect x="340" y="78" width="280" height="150" rx="8" fill="#fff" stroke="#d5d1c8"/><rect x="340" y="78" width="280" height="6" rx="3" fill="#333a78"/><text x="358" y="122" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#222">Work through a task</text><text x="358" y="161" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#424242">Flip cards or run a query</text><text x="358" y="188" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#424242">SQL engine in the browser</text><path d="M628 153h13m-5-5 5 5-5 5" fill="none" stroke="#333a78" stroke-width="2"/><rect x="650" y="78" width="280" height="150" rx="8" fill="#fff" stroke="#d5d1c8"/><rect x="650" y="78" width="280" height="6" rx="3" fill="#333a78"/><text x="668" y="122" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#222">Check your answer</text><text x="668" y="161" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#424242">Hints and explanations</text><text x="668" y="188" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#424242">Review local progress</text></svg>
